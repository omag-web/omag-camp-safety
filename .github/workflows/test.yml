# Checks every pull request before it can deploy: the backend and parser tests, and the worker
# container (the one that rebuilds the statute library in AWS) doing a real rebuild.
name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test

      - name: Parser tests
        run: node --test knowledge/scripts/*.test.mjs

      - name: Build the worker image
        run: docker build -f backend/worker.Dockerfile -t ranger-worker .

      - name: Rebuild the statute library inside the worker image
        # Same code and pdftotext the worker uses in AWS, against the real official sources.
        run: |
          docker run --rm --entrypoint /bin/sh ranger-worker -c '
            pdftotext -v 2>&1 | head -1
            cd /var/task && node --input-type=module -e "
              import { readFileSync } from \"node:fs\";
              const { buildLibrary } = await import(\"/var/task/knowledge/scripts/build.mjs\");
              await import(\"/var/task/backend/src/worker.mjs\");
              const cfg = JSON.parse(readFileSync(\"/var/task/knowledge/sources.json\", \"utf8\"));
              const { library } = await buildLibrary(cfg);
              if (library.count < 20) throw new Error(\"Only \" + library.count + \" sections\");
              console.log(\"Worker image OK:\", library.count, \"sections\");
            "'
