name: Temporary bill probe (delete after use)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -q poppler-utils >/dev/null
          curl -sfL -A "Mozilla/5.0" "https://www.oklahoma.gov/content/dam/ok/en/oem/documents/programs-and-services/HB1675-Enrolled.pdf" -o hb.pdf; echo "curl exit $? size $(stat -c%s hb.pdf 2>/dev/null)"; file hb.pdf
          pdftotext -enc UTF-8 hb.pdf - | head -120 | cat -A | cut -c1-160
          echo ==== SECTION lines; pdftotext -enc UTF-8 hb.pdf - | grep -nE "SECTION|codified|NEW LAW|ENR|Page " | head -40
