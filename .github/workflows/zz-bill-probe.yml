name: Temporary bill probe (delete after use)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y -q poppler-utils >/dev/null
          curl -sfL "https://www.oklahoma.gov/content/dam/ok/en/oem/documents/programs-and-services/HB1675-Enrolled.pdf" -o /tmp/hb.pdf
          pdftotext -enc UTF-8 /tmp/hb.pdf /tmp/hb.txt
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseEnrolledBill } from "./knowledge/scripts/parse.mjs";
            const cfg = JSON.parse(readFileSync("knowledge/sources.json", "utf8")).bills[0];
            const secs = parseEnrolledBill(readFileSync("/tmp/hb.txt", "utf8"), cfg);
            console.log("SECTIONS", secs.length, secs.map((s) => s.id).join(" "));
            for (const s of secs) console.log("----", s.id, s.heading, s.text.length, "chars\n" + s.text.slice(0, 700));
          '
