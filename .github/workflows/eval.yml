# Developer tool: asks the questions in backend/eval/questions.json against a private copy of
# Ranger running inside GitHub, with the live model. Day to day, answer checks run in AWS instead
# (admin panel → Answer checks, and every Monday), using the questions edited there.
name: Check Ranger's answers (developer copy)

on:
  workflow_dispatch:
    inputs:
      min:
        description: 'Share of questions that must pass (0–1)'
        default: '0.8'

permissions:
  id-token: write
  contents: read

env:
  STACK: ranger-camp-safety
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::237264540272:role/ranger-camp-safety-github-deploy

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Build the statute library if the repo doesn't have one yet
        working-directory: .
        run: |
          if [ -f backend/data/library.json ]; then exit 0; fi
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          node knowledge/scripts/build-library.mjs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Use the same AI model as the live site
        run: |
          MODEL=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Parameters[?ParameterKey=='ModelId'].ParameterValue" --output text)
          echo "MODEL_ID=${MODEL:-us.openai.gpt-5.6-terra}" >> "$GITHUB_ENV"
          echo "Model: ${MODEL}"

      - name: Start a private copy of Ranger
        run: |
          DAILY_LIMIT_PER_IP=1000 DAILY_LIMIT_GLOBAL=1000 nohup npm run dev > /tmp/ranger.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/health && exit 0; sleep 2; done
          cat /tmp/ranger.log; exit 1

      - name: Ask the questions
        env:
          RANGER_API: http://localhost:8787
          EVAL_MIN: ${{ inputs.min || '0.8' }}
        run: npm run eval

      - name: Server log (if something broke)
        if: failure()
        run: tail -200 /tmp/ranger.log
