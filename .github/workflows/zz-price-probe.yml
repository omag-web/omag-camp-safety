name: Temporary price probe (delete after use)
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sfL https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/index.json -o idx.json
          node -e 'const j=require("./idx.json"); for (const [k,v] of Object.entries(j.offers)) if (/bedrock|marketplace|openai/i.test(k)) console.log("OFFER", k, v.currentRegionIndexUrl || v.currentVersionUrl)'
          for svc in $(node -e 'const j=require("./idx.json"); console.log(Object.keys(j.offers).filter(k=>/bedrock/i.test(k)).join(" "))'); do
            curl -sfL "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/$svc/current/us-east-1/index.json" -o "$svc.json" || { echo "NOFILE $svc"; continue; }
            SVC=$svc node -e '
              const j=require("./"+process.env.SVC+".json"); const P=Object.values(j.products);
              const models={}; for (const p of P){ const a=p.attributes; const m=(a.provider||"?")+" | "+(a.model||a.titanModel||a.usagetype); models[m]=(models[m]||0)+1; }
              console.log("SERVICE", process.env.SVC, P.length, "products");
              for (const m of Object.keys(models).sort()) console.log("MODEL", process.env.SVC, m);
              const od=j.terms.OnDemand||{};
              for (const p of P.filter(p=>/gpt-5|5\.6|terra|luna|\bsol\b/i.test(JSON.stringify(p.attributes)))) { const t=Object.values(od[p.sku]||{})[0]; const d=t?Object.values(t.priceDimensions)[0]:null; console.log("HIT", JSON.stringify({a:p.attributes, usd:d&&d.pricePerUnit.USD, unit:d&&d.unit})); }'
          done
