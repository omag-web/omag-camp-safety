name: Build statute library (developer copy)

# Day to day, Ranger rebuilds its statute library in AWS: from the admin panel (Statute library →
# Rebuild now) and on the 3rd of each month, using the sources edited there.
#
# This workflow builds the copy that ships with each deploy (backend/data/library.json) from
# knowledge/sources.json, and commits it if anything changed. Run it by hand from the Actions tab
# when you want that copy refreshed. Pushes that change the parser just run its tests.

on:
  workflow_dispatch:
  push:
    paths:
      - 'knowledge/scripts/**'
      - '.github/workflows/library.yml'

permissions:
  contents: write

concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parser tests
        run: node --test knowledge/scripts/*.test.mjs

      - name: Install pdftotext
        if: github.event_name == 'workflow_dispatch'
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Build library
        if: github.event_name == 'workflow_dispatch'
        run: node knowledge/scripts/build-library.mjs

      - name: Commit if changed
        if: github.event_name == 'workflow_dispatch'
        run: |
          # `git status` (not `git diff`) so the very first library, not yet tracked, counts as a change.
          if [ -z "$(git status --porcelain -- backend/data/library.json)" ]; then
            echo "Library unchanged."
            exit 0
          fi
          git config user.name "ranger-library-bot"
          git config user.email "ranger-library-bot@users.noreply.github.com"
          git add backend/data/library.json
          git commit -m "Refresh statute library ($(date -u +%Y-%m-%d))"
          git push
