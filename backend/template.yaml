AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ranger, OMAG's camp safety assistant — streaming chat API (Lambda Function URL + Amazon Bedrock + DynamoDB)

Parameters:
  ModelId:
    Type: String
    Default: us.openai.gpt-5.6-terra
    Description: Bedrock inference profile ID. Default is OpenAI GPT-5.6 Terra, US-only routing. Alternatives are us.openai.gpt-5.6-sol (strongest) and us.openai.gpt-5.6-luna (cheapest); Claude profile IDs also work.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://omag-web.github.io,http://localhost:8787
    Description: Web origins allowed to call the API (no trailing slash). Add Ranger's own address (e.g. https://campsafety.omag.org) when it has one.
  ContactEmail:
    Type: String
    Default: ''
    Description: Email that receives "Talk to OMAG" messages (you'll get a confirmation email from AWS). Leave blank to only store them.
  DailyLimitPerIp:
    Type: Number
    Default: 60
    Description: Questions per IP address per day.
  DailyLimitGlobal:
    Type: Number
    Default: 600
    Description: Questions per day across everyone — a hard ceiling on spend.
  RetentionDays:
    Type: Number
    Default: 730
    Description: Days to keep conversation logs before DynamoDB deletes them.
  AdminEmail:
    Type: String
    Default: ''
    Description: First admin for the admin panel. AWS emails this address a temporary password. Add more admins later in the Cognito console.
  LibraryUrl:
    Type: String
    Default: https://omag-web.github.io/omag-camp-safety/backend/data/library.json
    Description: Older fallback for the statute library download. The GitHub Action now publishes the library straight to the data bucket, so this is only used if that copy is missing.
  RequireAdminMfa:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Every admin must use two-step sign-in (an authenticator app). Admins who haven't set it up are walked through it at their next sign-in.
  SiteDomain:
    Type: String
    Default: ''
    Description: Ranger's web address on OMAG's domain, e.g. campsafety.omag.org. Blank = no custom site (pages stay wherever they are hosted now).
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone ID for the domain (e.g. Z0123456789ABC) when it's in this AWS account. Blank = you add the DNS records by hand.

Conditions:
  HasContactEmail: !Not [!Equals [!Ref ContactEmail, '']]
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, '']]
  HasSite: !Not [!Equals [!Ref SiteDomain, '']]
  MfaRequired: !Equals [!Ref RequireAdminMfa, 'true']
  HasZone: !And [!Condition HasSite, !Not [!Equals [!Ref HostedZoneId, '']]]

Globals:
  Function:
    Tags:
      app: ranger

Resources:
  RangerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - { Key: app, Value: ranger }

  # Uploaded OMAG documents and the refreshed statute library. Private.
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !If [HasSite, !Split [',', !Join [',', [!Join [',', !Ref AllowedOrigins], !Sub 'https://${SiteDomain}']]], !Ref AllowedOrigins]
            AllowedMethods: [PUT]
            AllowedHeaders: [content-type]
            MaxAge: 3600
      # Keep replaced or deleted files (templates, OMAG documents) for 90 days, so mistakes can be undone.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
            ExpiredObjectDeleteMarker: true
          - Id: imports
            Status: Enabled
            Prefix: imports/
            ExpirationInDays: 1
      Tags:
        - { Key: app, Value: ranger }

  # Admin sign-in. Only admins create accounts (no public sign-up).
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-admins
      UsernameAttributes: [email]
      # Two-step sign-in with an authenticator app. Required for every admin (RequireAdminMfa);
      # admins without it are asked to set it up when they sign in.
      MfaConfiguration: !If [MfaRequired, 'ON', 'OPTIONAL']
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your Ranger admin account
          EmailMessage: !Sub
            - 'You''ve been added as an admin for Ranger, OMAG''s camp safety assistant. Sign in at ${AdminUrl} with your email {username} and this temporary password: {####} . You''ll choose your own password the first time you sign in.'
            - AdminUrl: !If [HasSite, !Sub 'https://${SiteDomain}/admin/', 'https://omag-web.github.io/omag-camp-safety/web/admin/']
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolTags:
        app: ranger

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: ranger-admin-web
      AuthSessionValidity: 15   # minutes to finish a sign-in step (default 3 is too short to set up an authenticator app)
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 8
      AccessTokenValidity: 8
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }

  FirstAdmin:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasAdminEmail
    Properties:
      UserPoolId: !Ref AdminUserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - { Name: email, Value: !Ref AdminEmail }
        - { Name: email_verified, Value: 'true' }

  ContactTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Ranger - Talk to OMAG
      Tags:
        - { Key: app, Value: ranger }

  # "Talk to OMAG" notes from members. Who gets them is managed in the admin panel
  # (Settings → Who gets Ranger's emails). Until someone confirms here, notes go to ContactTopic.
  MessagesTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Ranger - Talk to OMAG messages
      Tags:
        - { Key: app, Value: ranger }

  ContactSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasContactEmail
    Properties:
      TopicArn: !Ref ContactTopic
      Protocol: email
      Endpoint: !Ref ContactEmail

  RangerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Ranger chat API
      CodeUri: ./
      Handler: src/handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 1024
      # Answers stop researching after ~3 minutes (agent.mjs); this leaves room to finish writing.
      Timeout: 300
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          TABLE_NAME: !Ref RangerTable
          CONTACT_TOPIC_ARN: !Ref ContactTopic
          DAILY_LIMIT_PER_IP: !Ref DailyLimitPerIp
          DAILY_LIMIT_GLOBAL: !Ref DailyLimitGlobal
          RETENTION_DAYS: !Ref RetentionDays
          HASH_SALT: !Ref AWS::StackId
          DATA_BUCKET: !Ref DataBucket
          USER_POOL_ID: !Ref AdminUserPool
          USER_POOL_CLIENT_ID: !Ref AdminUserPoolClient
          LIBRARY_URL: !Ref LibraryUrl
          WORKER_FUNCTION: !Ref WorkerFunction
          ADMIN_MFA_REQUIRED: !Ref RequireAdminMfa
          MESSAGES_TOPIC_ARN: !Ref MessagesTopic
          ADMIN_URL: !If [HasSite, !Sub 'https://${SiteDomain}/admin/', 'https://omag-web.github.io/omag-camp-safety/web/admin/']
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RangerTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ContactTopic.TopicName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt MessagesTopic.TopicName
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkerFunction
        - Statement:
            # Settings → "Who gets Ranger's emails" manages the topics' email subscriptions.
            - Effect: Allow
              Action: [sns:ListSubscriptionsByTopic, sns:Subscribe, sns:Unsubscribe]
              Resource: [!Ref ContactTopic, !Sub '${ContactTopic}:*', !Ref MessagesTopic, !Sub '${MessagesTopic}:*']
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminResetUserPassword
                - cognito-idp:AdminSetUserMFAPreference
              Resource: !GetAtt AdminUserPool.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:application-inference-profile/*
      Events:
        DailyLibraryRefresh:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Input: '{"rangerTask":"refresh-library"}'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins: !If [HasSite, !Split [',', !Join [',', [!Join [',', !Ref AllowedOrigins], !Sub 'https://${SiteDomain}']]], !Ref AllowedOrigins]
          AllowMethods: [GET, POST, PUT, DELETE]
          AllowHeaders: [content-type, authorization]
          MaxAge: 86400

  # The worker: long jobs started from the admin panel or on a schedule — rebuilding the statute
  # library from the sources edited there (needs pdftotext, hence a container image) and running
  # the answer checks. See src/worker.mjs and worker.Dockerfile.
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Ranger worker (statute library rebuilds, answer checks)
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage: { Size: 2048 }
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          TABLE_NAME: !Ref RangerTable
          CONTACT_TOPIC_ARN: !Ref ContactTopic
          RETENTION_DAYS: !Ref RetentionDays
          DATA_BUCKET: !Ref DataBucket
          LIBRARY_URL: !Ref LibraryUrl
          ADMIN_URL: !If [HasSite, !Sub 'https://${SiteDomain}/admin/', 'https://omag-web.github.io/omag-camp-safety/web/admin/']
          NODE_OPTIONS: --enable-source-maps
      EventInvokeConfig:
        MaximumRetryAttempts: 0   # a failed run reports itself; don't start it again behind the admin's back
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RangerTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ContactTopic.TopicName
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - arn:aws:bedrock:*::foundation-model/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:application-inference-profile/*
      Events:
        MonthlyLibraryRebuild:
          Type: Schedule
          Properties:
            Schedule: cron(17 9 3 * ? *)          # 3rd of each month, 09:17 UTC
            Input: '{"task":"build-library"}'
        WeeklyAnswerChecks:
          Type: Schedule
          Properties:
            Schedule: cron(17 13 ? * MON *)       # Mondays, about 8am Central
            Input: '{"task":"run-checks"}'
    Metadata:
      DockerContext: ..
      Dockerfile: backend/worker.Dockerfile
      DockerTag: worker

  # Since October 2025 a public Function URL needs lambda:InvokeFunction as well as
  # lambda:InvokeFunctionUrl. SAM adds the URL permission; this adds the other one,
  # limited to calls that come through the function URL.
  RangerFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RangerFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  RangerFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RangerFunction}
      RetentionInDays: 90

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasContactEmail
    Properties:
      AlarmDescription: Ranger API is returning errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref RangerFunction }
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ContactTopic]

  # ---------- alerts (emailed to ContactEmail) ----------
  ThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasContactEmail
    Properties:
      AlarmDescription: Ranger turned requests away because too many were running at once (reserved concurrency).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref RangerFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ContactTopic]

  SlowAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasContactEmail
    Properties:
      AlarmDescription: A Ranger answer took more than 4 minutes (the limit is 5). Check CloudWatch logs and the model.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref RangerFunction }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 240000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ContactTopic]

  DailyLimitAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasContactEmail
    Properties:
      AlarmDescription: Ranger reached its daily question limit for everyone. Members are being turned away until midnight UTC. Raise the limit in Settings if this is real use.
      Namespace: Ranger
      MetricName: GlobalLimitReached
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ContactTopic]

  FallbackAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasContactEmail
    Properties:
      AlarmDescription: Ranger's main AI model failed several times in an hour and Ranger used the backup model. Check Amazon Bedrock and the model setting.
      Namespace: Ranger
      MetricName: ModelFallback
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ContactTopic]

  # An outside check that Ranger answers, every 30 seconds from three regions.
  HealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Select [2, !Split ['/', !GetAtt RangerFunctionUrl.FunctionUrl]]
        ResourcePath: /health
        Port: 443
        RequestInterval: 30
        FailureThreshold: 3
        Regions: [us-east-1, us-west-1, us-west-2]
        EnableSNI: true
      HealthCheckTags:
        - { Key: Name, Value: !Sub '${AWS::StackName} Ranger API' }
        - { Key: app, Value: ranger }

  DownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasContactEmail
    Properties:
      AlarmDescription: Ranger's API isn't answering its health check. Members can't use Ranger.
      Namespace: AWS/Route53
      MetricName: HealthCheckStatus
      Dimensions: [{ Name: HealthCheckId, Value: !Ref HealthCheck }]
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # A failed check reports 0, so "down" always shows up as data. Missing data just means
      # Route 53 hasn't reported yet (for example, right after a deploy), not that Ranger is down.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ContactTopic]
      OKActions: [!Ref ContactTopic]

  # ---------- Ranger's web pages on OMAG's own domain (only when SiteDomain is set) ----------
  # A private S3 bucket holds web/; CloudFront serves it over HTTPS at SiteDomain.
  SiteBucket:
    Type: AWS::S3::Bucket
    Condition: HasSite
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags:
        - { Key: app, Value: ranger }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasSite
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  # The HTTPS certificate. With HostedZoneId, AWS adds the DNS check itself; without it, the stack
  # waits while you add the CNAME shown under Certificate Manager → the certificate → Domains.
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasSite
    Properties:
      DomainName: !Ref SiteDomain
      ValidationMethod: DNS
      DomainValidationOptions: !If
        - HasZone
        - [{ DomainName: !Ref SiteDomain, HostedZoneId: !Ref HostedZoneId }]
        - !Ref AWS::NoValue
      Tags:
        - { Key: app, Value: ranger }

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: HasSite
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # /admin/ → /admin/index.html (S3 has no folder index pages).
  SiteIndexFunction:
    Type: AWS::CloudFront::Function
    Condition: HasSite
    Properties:
      Name: !Sub '${AWS::StackName}-site-index'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for folder addresses
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.slice(-1) === '/') r.uri += 'index.html';
          else if (r.uri.split('/').pop().indexOf('.') === -1) {
            return { statusCode: 301, statusDescription: 'Moved', headers: { location: { value: r.uri + '/' } } };
          }
          return r;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasSite
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Ranger web pages (${SiteDomain})'
        Aliases: [!Ref SiteDomain]
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteIndexFunction.FunctionMetadata.FunctionARN
      Tags:
        - { Key: app, Value: ranger }

  SiteRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: A
      AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

  SiteRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomain
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt SiteDistribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  AdminUrl:
    Description: The admin panel
    Value: !If [HasSite, !Sub 'https://${SiteDomain}/admin/', 'https://omag-web.github.io/omag-camp-safety/web/admin/']
  MemberUrl:
    Description: The member page
    Value: !If [HasSite, !Sub 'https://${SiteDomain}/', 'https://omag-web.github.io/omag-camp-safety/web/']
  DataBucketName:
    Description: Where the library workflow publishes the statute library
    Value: !Ref DataBucket
  SiteBucketName:
    Condition: HasSite
    Description: Where the web pages are published
    Value: !Ref SiteBucket
  SiteDistributionId:
    Condition: HasSite
    Value: !Ref SiteDistribution
  SiteDnsTarget:
    Condition: HasSite
    Description: If the domain isn't in this AWS account, point SiteDomain here with a CNAME record
    Value: !GetAtt SiteDistribution.DomainName
  UserPoolId:
    Description: The admin user pool (add admins on the Admins page of the admin panel)
    Value: !Ref AdminUserPool
  ApiUrl:
    Description: Put this in web/config.js as apiUrl
    Value: !GetAtt RangerFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref RangerTable
  ContactTopicArn:
    Value: !Ref ContactTopic
